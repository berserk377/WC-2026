function matchRowHTML(match) {
  const flag1 = FLAGS[match.t1] || '❓';
  const flag2 = FLAGS[match.t2] || '❓';
  const result = MATCH_RESULTS[`${match.t1}-${match.t2}`];
  const venue = match.v ? `<div class="venue">${match.v}</div>` : '';

  if (result) {
    const isLive = ["1H", "2H", "ET", "P", "BT"].includes(result.status);
    const statusLabel = isLive ? `<span class="status-badge status-live">🔴 LIVE ${result.elapsed}'</span>` :
                        (result.status === 'FT' ? '<span class="status-badge status-ft">✅ FT</span>' : '');
    return `
      ${statusLabel}
      <div class="match-teams">
        <div class="team-block home">
          <span class="flag">${flag1}</span>
          <span class="team-name">${match.t1}</span>
        </div>
        <div class="score-display">${result.goalsHome} - ${result.goalsAway}</div>
        <div class="team-block away">
          <span class="flag">${flag2}</span>
          <span class="team-name">${match.t2}</span>
        </div>
      </div>
      <div class="match-meta">
        <div class="time-date">${match.ti} BST</div>
        ${venue}
      </div>
      <div class="scorers">
        <div class="scorers-home">${result.eventsHome || ''}</div>
        <div class="scorers-away">${result.eventsAway || ''}</div>
      </div>
    `;
  }
  return `
    <div class="match-teams">
      <div class="team-block home">
        <span class="flag">${flag1}</span>
        <span class="team-name">${match.t1}</span>
      </div>
      <div class="vs">vs</div>
      <div class="team-block away">
        <span class="flag">${flag2}</span>
        <span class="team-name">${match.t2}</span>
      </div>
    </div>
    <div class="match-meta">
      <div class="time-date">${match.ti} BST</div>
      ${venue}
    </div>
  `;
}

function renderDays(days, container) {
  days.forEach(day => {
    if (day.r) {
      const roundTitle = document.createElement('div');
      roundTitle.className = 'round-title';
      roundTitle.innerHTML = day.r;
      container.appendChild(roundTitle);
    }

    const dayHeader = document.createElement('div');
    dayHeader.className = 'date-header';
    dayHeader.innerHTML = `📅 ${day.d}`;
    container.appendChild(dayHeader);

    day.m.forEach(match => {
      const row = document.createElement('div');
      row.className = 'match-row';
      row.innerHTML = matchRowHTML(match);
      container.appendChild(row);
    });
  });
}

function render() {
  const container = document.getElementById('fixture-list');
  container.innerHTML = '';

  const groupTitle = document.createElement('div');

  groupTitle.textContent = '⚽ GROUP STAGE';
  container.appendChild(groupTitle);

  renderDays(SCHEDULE, container);
  renderDays(KNOCKOUT, container);
}

const API_KEY = "18545b2bf8144c62c439cbb3a84cad1e";
const BASE_URL = "https://v3.football.api-sports.io";
let MATCH_RESULTS = {};

async function fetchScores() {
  try {
    const response = await fetch(`${BASE_URL}/fixtures?league=1&season=2026`, {
      headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
    });
    const data = await response.json();
    if (data.response) {
      const newResults = {};
      for (const m of data.response) {
        const home = m.teams.home.name;
        const away = m.teams.away.name;

        let eventsHome = "";
        let eventsAway = "";

        const isLiveOrFT = ["1H", "2H", "ET", "P", "BT", "FT", "AET", "PEN"].includes(m.fixture.status.short);

        if (isLiveOrFT) {
          try {
            const evRes = await fetch(`${BASE_URL}/fixtures/events?fixture=${m.fixture.id}`, {
              headers: { "x-rapidapi-key": API_KEY, "x-rapidapi-host": "v3.football.api-sports.io" }
            });
            const evData = await evRes.json();
            if (evData.response) {
              evData.response.filter(e => e.type === "Goal").forEach(e => {
                const goalStr = `⚽ ${e.player.name} ${e.time.elapsed}'`;
                if (e.team.id === m.teams.home.id) eventsHome += (eventsHome ? ", " : "") + goalStr;
                else eventsAway += (eventsAway ? ", " : "") + goalStr;
              });
            }
          } catch (e) {}
        }

        newResults[`${home}-${away}`] = {
          goalsHome: m.goals.home ?? 0,
          goalsAway: m.goals.away ?? 0,
          status: m.fixture.status.short,
          elapsed: m.fixture.status.elapsed,
          eventsHome,
          eventsAway
        };
      }
      MATCH_RESULTS = newResults;
      render();
      const now = new Date();
      document.getElementById('last-updated').innerHTML = `🔄 Last updated: ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    }
  } catch (err) {
    console.error(err);
    document.getElementById('last-updated').innerHTML = "❌ Update failed";
  }
}

function autoScroll() {
  const now = new Date();
  const testDate = new Date('2026-06-12');
  const dateToUse = (now.getFullYear() === 2026) ? now : testDate;

  const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const targetMonth = monthNames[dateToUse.getMonth()];
  const targetDay = dateToUse.getDate();
  const searchStr = `${targetMonth} ${targetDay},`;

  const headers = document.querySelectorAll('.date-header');
  for (let h of headers) {
    if (h.textContent.includes(searchStr)) {
      setTimeout(() => {
        const headerOffset = 70;
        const elementPosition = h.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
      }, 300);
      break;
    }
  }
}

render();
autoScroll();
fetchScores();
setInterval(fetchScores, 60000);
</script>
