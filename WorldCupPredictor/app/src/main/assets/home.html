<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WC 2026 - Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0a0f1e;
    color: #f0f0f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .trophy { font-size: 80px; margin-bottom: 20px; }
  h1 { font-size: 32px; font-weight: 800; color: #f0c040; margin-bottom: 8px; letter-spacing: 1px; }
  p { font-size: 14px; color: #8899bb; margin-bottom: 40px; }

  .menu { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 16px; }
  .btn {
    display: block;
    padding: 16px;
    background: #1a2540;
    border: 1px solid #2a3a5c;
    border-radius: 12px;
    color: #f0c040;
    text-decoration: none;
    font-size: 18px;
    font-weight: 600;
    transition: transform 0.2s, background 0.2s;
  }
  .btn:active { transform: scale(0.98); background: #2a3a5c; }

  .footer { position: absolute; bottom: 20px; font-size: 10px; color: #445566; text-transform: uppercase; letter-spacing: 2px; }

  .greeting { font-size: 13px; color: #f0c040; margin-bottom: 24px; }
  .logout { position: absolute; top: 16px; right: 16px; font-size: 12px; color: #1a0a00; background: #f0c040; border: 1px solid #f0c040; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
  .logout:active { background: #d4a737; }

  /* Profile Button & Card Styles */
  .profile-btn { position: absolute; top: 16px; left: 16px; width: 34px; height: 34px; border-radius: 50%; background: #f0c040; color: #1a0a00; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: transform 0.2s; z-index: 101; }
  .profile-btn:active { transform: scale(0.9); }

  .profile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .profile-card { background: #111827; border: 2px solid #f0c040; border-radius: 16px; padding: 30px; width: 100%; max-width: 280px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .profile-card h2 { font-size: 24px; color: #f0c040; margin-bottom: 8px; }
  .profile-card p { font-size: 14px; color: #8899bb; margin-bottom: 24px; word-break: break-all; }
  .profile-card .close-btn { background: #1a2540; border: 1px solid #2a3a5c; color: #f0c040; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }

  .delete-btn { width: 100%; background: #2a0a0a; border: 1px solid #ff4444; color: #ff6b6b; font-size: 14px; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 20px; margin-bottom: 12px; transition: background 0.2s; }
  .delete-btn:active { background: #3d0f0f; }

  /* Custom Password Modal Styles */
  .password-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
  .password-box { background: #111827; border: 2px solid #ff4444; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 280px; text-align: center; }
  .password-box h3 { font-size: 18px; color: #ff6b6b; margin-bottom: 8px; }
  .password-box p { font-size: 13px; color: #8899bb; margin-bottom: 16px; line-height: 1.5; }
  .password-box input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #ff4444; background: #0a0f1e; color: #f0f0f0; font-size: 15px; outline: none; margin-bottom: 8px; }
  .password-box input:focus { border-color: #ff6b6b; }
  .password-error { color: #ff6b6b; font-size: 12px; min-height: 16px; margin-bottom: 12px; text-align: left; }
  .password-btns { display: flex; gap: 10px; }
  .password-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-cancel { background: #1a2540; border: 1px solid #2a3a5c; color: #f0c040; }
  .btn-delete { background: #2a0a0a; border: 1px solid #ff4444; color: #ff6b6b; }
</style>
</head>
<body>

<button class="profile-btn" onclick="toggleProfile(true)">👤</button>
<button class="logout" onclick="logout()">Logout</button>

<div id="profile-overlay" class="profile-overlay">
  <div class="profile-card">
    <h2 id="profile-name">Username</h2>
    <p id="profile-email">email@example.com</p>
    <button class="close-btn" onclick="toggleProfile(false)">Close</button>
    <button class="delete-btn" onclick="deleteAccount()">🗑️ Delete Account</button>
  </div>
</div>

<div class="trophy">🏆</div>
<h1>World Cup 2026</h1>
<p>June 11 – July 19 | USA, Canada, Mexico</p>
<div class="greeting" id="greeting"></div>

<div class="menu">
  <a href="fixture.html" class="btn">📅 Fixture</a>
  <a href="index.html" class="btn">🔮 Predictor</a>
</div>

<div class="footer">ROAD TO GLORY</div>

<div id="password-overlay" class="password-overlay">
  <div class="password-box">
    <h3>🗑️ Delete Account</h3>
    <p>Enter your password to permanently delete your account.</p>
    <input id="delete-password" type="password" placeholder="Your password">
    <div id="delete-error" class="password-error"></div>
    <div class="password-btns">
      <button class="btn-cancel" onclick="togglePasswordModal(false)">Cancel</button>
      <button class="btn-delete" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCRxHYGhPA7ico0ykuI-lYzGtarMKLIXj8",
    authDomain: "worldcup2026-e94c4.firebaseapp.com",
    projectId: "worldcup2026-e94c4",
    storageBucket: "worldcup2026-e94c4.firebasestorage.app",
    messagingSenderId: "419636041438",
    appId: "1:419636041438:web:cb7eadefdcbeec5c87d44f"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  function toggleProfile(show) {
    document.getElementById('profile-overlay').style.display = show ? 'flex' : 'none';
  }

  function deleteAccount() {
    toggleProfile(false);
    document.getElementById('delete-password').value = '';
    document.getElementById('delete-error').textContent = '';
    togglePasswordModal(true);
  }

  function togglePasswordModal(show) {
    document.getElementById('password-overlay').style.display = show ? 'flex' : 'none';
  }

  function doDelete() {
    const password = document.getElementById('delete-password').value;
    const errEl = document.getElementById('delete-error');
    if (!password) { errEl.textContent = 'Please enter your password.'; return; }

    const user = firebase.auth().currentUser;
    if (!user) { errEl.textContent = 'No user found.'; return; }

    const credential = firebase.auth.EmailAuthProvider.credential(user.email, password);

    user.reauthenticateWithCredential(credential)
      .then(() => user.delete())
      .then(() => {
        location.replace('auth.html');
      })
      .catch(error => {
        if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          errEl.textContent = 'Wrong password. Try again.';
        } else {
          errEl.textContent = 'Error: ' + error.message;
        }
      });
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a2540;color:#f0c040;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999;border:1px solid #2a3a5c;max-width:280px;text-align:center;';
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // Monitor Auth state
  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      location.replace('auth.html');
      return;
    }

    function refreshProfile(retries = 0) {
      const currentUser = firebase.auth().currentUser;

      // ১. URL থেকে নাম নেয়ার চেষ্টা (সবচেয়ে আগে)
      const urlParams = new URLSearchParams(window.location.search);
      const urlName = urlParams.get('user');

      // ২. লোকাল স্টোরেজ থেকে নাম চেক করছি (সবচেয়ে দ্রুত ফলব্যাক)
      const localName = localStorage.getItem('wc_username');

      // ৩. তারপর Firebase-এর নাম চেক করছি (অফিসিয়াল)
      const firebaseName = currentUser ? currentUser.displayName : null;

      const finalName = urlName || firebaseName || localName;

      if (finalName) {
        document.getElementById('greeting').textContent = 'Welcome, ' + finalName + ' 👋';
        document.getElementById('profile-name').textContent = finalName;
        document.getElementById('profile-email').textContent = currentUser.email;

        // যদি Firebase-এ নাম এখনো না থাকে কিন্তু লোকাল স্টোরেজে থাকে, তবে ব্যাকগ্রাউন্ডে রিলোড হতে থাকবে
        if (!firebaseName && retries < 5) {
            currentUser.reload().then(() => {
                setTimeout(() => refreshProfile(retries + 1), 1000);
            });
        }
      } else if (retries < 8) {
        // কোনো নামই পাওয়া যায়নি, আবার ট্রাই করছি
        currentUser.reload().then(() => {
          setTimeout(() => refreshProfile(retries + 1), 1000);
        });
      } else {
        // সব চেষ্টা ব্যর্থ হলে ডিফল্ট
        document.getElementById('greeting').textContent = 'Welcome, Predictor 👋';
        document.getElementById('profile-name').textContent = 'Predictor';
        document.getElementById('profile-email').textContent = currentUser.email;
      }
    }

    refreshProfile();
  });

  function logout() {
    firebase.auth().signOut().then(() => {
      location.replace('auth.html');
    }).catch(error => {
      console.error('Logout error:', error);
      location.replace('auth.html');
    });
  }
</script>

</body>
</html>
