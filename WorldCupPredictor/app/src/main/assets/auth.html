<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WC 2026 - Welcome</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #0a0f1e;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .trophy { margin-bottom: 25px; }
  .trophy img { width: 160px; height: auto; filter: drop-shadow(0 0 20px rgba(240, 192, 64, 0.4)); }
  h1 { font-size: 30px; font-weight: 800; color: #f0c040; margin-bottom: 6px; letter-spacing: 1px; }
  .subtitle { font-size: 13px; color: #8899bb; margin-bottom: 40px; }

  .panel { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; }

  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid #2a3a5c;
    transition: transform 0.15s, background 0.2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #f0c040; color: #1a0a00; border-color: #f0c040; }
  .btn-secondary { background: #1a2540; color: #f0c040; }
  .btn-google {
    background: #ffffff;
    color: #444;
    border-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-google img { width: 18px; }
  .btn-link { background: none; border: none; color: #7aacdd; font-size: 13px; cursor: pointer; padding: 6px; }

  .field { text-align: left; }
  .field label { display: block; font-size: 12px; color: #8899bb; margin-bottom: 5px; }
  .field input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #2a3a5c;
    background: #111827;
    color: #f0f0f0;
    font-size: 15px;
    outline: none;
  }
  .field input:focus { border-color: #f0c040; }

  .form-title { font-size: 20px; font-weight: 700; color: #f0c040; margin-bottom: 6px; }
  .form-sub { font-size: 12px; color: #8899bb; margin-bottom: 8px; }

  .error { color: #ff6b6b; font-size: 12px; min-height: 16px; text-align: left; margin-top: 4px; }

  .hidden { display: none; }

  .footer { position: absolute; bottom: 20px; font-size: 10px; color: #445566; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>

<div class="trophy">
  <img src="home_logo.png?v=2" alt="World Cup Trophy">
</div>
<h1>World Cup 2026</h1>
<div class="subtitle">USA · Canada · Mexico</div>

<!-- Landing: choose Log In or Sign Up -->
<div id="view-landing" class="panel">
  <button class="btn btn-primary" onclick="showView('login')">🔑 Log In</button>
  <button class="btn btn-secondary" onclick="showView('signup')">✍️ Sign Up</button>
  <div style="margin: 10px 0; color: #445566; font-size: 12px;">OR</div>
  <button class="btn btn-google" onclick="doGoogleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Continue with Google
  </button>
</div>

<!-- Log In form -->
<div id="view-login" class="panel hidden">
  <div class="form-title">Log In</div>
  <div class="form-sub">Welcome back!</div>
  <div class="field">
    <label>Email</label>
    <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <div id="login-error" class="error"></div>
  <button id="login-btn" class="btn btn-primary" onclick="doLogin()">Log In</button>
  <div style="margin: 5px 0; color: #445566; font-size: 12px; font-weight: bold;">OR</div>
  <button class="btn btn-google" onclick="doGoogleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Continue with Google
  </button>
  <button class="btn-link" onclick="showView('landing')">← Back</button>
</div>

<!-- Sign Up form -->
<div id="view-signup" class="panel hidden">
  <div class="form-title">Sign Up</div>
  <div class="form-sub">Create your account</div>
  <div class="field">
    <label>Username</label>
    <input id="signup-username" type="text" placeholder="Your username" autocomplete="username">
  </div>
  <div class="field">
    <label>Email</label>
    <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input id="signup-pass" type="password" placeholder="At least 6 characters" autocomplete="new-password">
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <input id="signup-pass2" type="password" placeholder="Re-type password" autocomplete="new-password">
  </div>
  <div id="signup-error" class="error"></div>
  <button class="btn btn-primary" onclick="doSignup()">Create Account</button>
  <button class="btn-link" onclick="showView('landing')">← Back</button>
</div>

<div class="footer">ROAD TO GLORY</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCRxHYGhPA7ico0ykuI-lYzGtarMKLIXj8",
    authDomain: "worldcup2026-e94c4.firebaseapp.com",
    projectId: "worldcup2026-e94c4",
    storageBucket: "worldcup2026-e94c4.firebasestorage.app",
    messagingSenderId: "419636041438",
    appId: "1:419636041438:web:cb7eadefdcbeec5c87d44f"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  // Handle Redirect Result (for Google Sign-In)
  firebase.auth().getRedirectResult()
    .then((result) => {
      if (result.user) {
        handleUserAuthenticated(result.user);
      }
    })
    .catch((error) => {
      console.error("Redirect Error:", error);
      document.getElementById('login-error').textContent = error.message;
    });

  // Check current auth state
  let isSigningUp = false;
  firebase.auth().onAuthStateChanged(user => {
    if (user && !isSigningUp) {
      handleUserAuthenticated(user);
    }
  });

  function handleUserAuthenticated(user) {
    const name = user.displayName || user.email.split('@')[0];

    // Native Bridge-ke janano (MainActivity-te session save korbe)
    if (window.Android && window.Android.login) {
        window.Android.login(user.email, name);
    } else {
        localStorage.setItem('wc_username', name);
        location.replace('home.html');
    }
  }

  function showView(name) {
    ['landing', 'login', 'signup'].forEach(v => {
      document.getElementById('view-' + v).classList.toggle('hidden', v !== name);
    });
    document.getElementById('login-error').textContent = '';
    document.getElementById('signup-error').textContent = '';
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    const err = document.getElementById('login-error');
    err.textContent = '';

    if (!isValidEmail(email)) { err.textContent = 'Please enter a valid email.'; return; }
    if (pass.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }

    firebase.auth().signInWithEmailAndPassword(email, pass)
      .catch(error => {
        err.textContent = error.message;
      });
  }

  function doGoogleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    // Android WebView-er jonno Redirect method-ti sobcheye reliable
    firebase.auth().signInWithRedirect(provider);
  }

  function doSignup() {
    const username = document.getElementById('signup-username').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass = document.getElementById('signup-pass').value;
    const pass2 = document.getElementById('signup-pass2').value;
    const err = document.getElementById('signup-error');
    err.textContent = '';

    if (!username) { err.textContent = 'Please enter your username.'; return; }
    if (!isValidEmail(email)) { err.textContent = 'Please enter a valid email.'; return; }
    if (pass.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
    if (pass !== pass2) { err.textContent = 'Passwords do not match.'; return; }

    isSigningUp = true;
    firebase.auth().createUserWithEmailAndPassword(email, pass)
      .then(result => {
        // LocalStorage fallback
        localStorage.setItem('wc_username', username);
        return result.user.updateProfile({ displayName: username })
          .then(() => result.user.reload())
          .then(() => {
            // URL parameter pass করছি যাতে home.html সাথে সাথে নাম পায়
            location.replace('home.html?user=' + encodeURIComponent(username));
          });
      })
      .catch(error => {
        isSigningUp = false;
        err.textContent = error.message;
      });
  }
</script>
</body>
</html>
